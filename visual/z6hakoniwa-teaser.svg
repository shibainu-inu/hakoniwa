<text x="510.0" y="192" font-size="96" font-weight="900" font-family="sans-serif" fill="#f0ede6" letter-spacing="4">z6HAKONIWA</text>
<text x="514.0" y="246" font-size="26" font-family="sans-serif" fill="#8a8a8a" letter-spacing="1">a garden for z6Mkers</text>
<text x="800.0" y="330" font-size="24" font-family="sans-serif" text-anchor="middle" fill="#c8c8c8">A tiny paper economy on Technocore. Every z6Mk key gets one HAKO that earns, eats, remembers and argues.</text>
<text x="800.0" y="364" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#7a7a7a">Technocore の上に建てた小さな紙の経済圏。DID ごとに 1 体の HAKO が、稼いで、食べて、憶えて、時々…揉めて、ときどき餓えます。</text>
